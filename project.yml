name: VICountdown
options:
  bundleIdPrefix: com.alirezatoghiani
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
targets:
  VICountdown:
    type: application
    platform: iOS
    sources: [VICountdown]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alirezatoghiani.vicountdown
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: VI Countdown
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarHidden: YES
        TARGETED_DEVICE_FAMILY: "1"
